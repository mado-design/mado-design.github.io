<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="mobile-logo.css" />
    <script src="project-navigation.js" defer></script>
    <title>嘔吐</title>
    <style>
      :root {
        --page-muted: rgba(17, 17, 17, .52);
        --content-width: 1440px;
        --gutter: clamp(20px, 4vw, 64px);
        --logo-size: 195px;
        --logo-inset-y: 8px;
        --logo-anchor-left: calc(var(--gutter) - var(--logo-size) * .19394);
        --logo-visual-top: calc(var(--logo-size) * .21778);
        --logo-travel: calc(100vw - var(--logo-anchor-left) * 2 - var(--logo-size));
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; color: #111; font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
      body { overflow-x: hidden; }
      .project-page { width: min(100%, calc(var(--content-width) + var(--gutter) * 2)); margin: 0 auto; padding: 0 var(--gutter) 80px; }
      .project-logo-shell { position: fixed; left: auto; right: var(--logo-anchor-left); top: var(--logo-inset-y); display: block; width: var(--logo-size); height: var(--logo-size); z-index: 30; cursor: grab; mix-blend-mode: difference; animation: project-logo-enter 1200ms cubic-bezier(.65,0,.35,1) both; will-change: transform; }
      @keyframes project-logo-enter { from { transform: translateX(calc(0px - var(--logo-travel))); } to { transform: translateX(0); } }
      .project-logo-outline { position: absolute; inset: 0; display: block; width: 100%; height: 100%; opacity: 1; transition: opacity 160ms ease; filter: brightness(0) invert(1); -webkit-filter: brightness(0) invert(1); }
      .project-logo-solid { position: absolute; left: 19.394%; top: 21.778%; display: block; width: 61.212%; height: 56.443%; opacity: 0; transition: opacity 160ms ease; filter: brightness(0) invert(1); -webkit-filter: brightness(0) invert(1); }
      .project-logo-shell:hover .project-logo-outline, .project-logo-shell.is-active .project-logo-outline { opacity: 0; }
      .project-logo-shell:hover .project-logo-solid, .project-logo-shell.is-active .project-logo-solid { opacity: 1; }
      .project-logo-shell.is-active { cursor: grabbing; }
      .project-description { max-width: 720px; padding-top: calc(var(--logo-visual-top) + 8px); padding-bottom: 64px; animation: description-enter 1200ms cubic-bezier(.65,0,.35,1) 140ms both; }
      @keyframes description-enter { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
      .project-description-title, .project-description-year { margin: 0; font-weight: 400; line-height: 1.2; }
      .project-description-title { font-size: 22px; }
      .project-description-year { margin-top: 28px; font-size: 18px; }
      .project-description-copy { width: min(100%, 432px); margin-top: 56px; text-align: left; }
      .project-description-copy p { margin: 0; font-size: 18px; line-height: 1.5; }
      .project-description-copy p + p { margin-top: 42px; }
      .project-gallery { display: grid; gap: 40px; }
      .project-hero { width: 100vw; aspect-ratio: 16 / 9; margin-left: calc(50% - 50vw); background: #fff; }
      .project-hero img { width: 100%; height: 100%; object-fit: contain; }
      .project-row { display: grid; gap: 40px; }
      .project-row.two-up { grid-template-columns: 1fr; }
      figure { margin: 0; }
      figure img { display: block; width: 100%; height: auto; }
      .project-gallery figure { opacity: 0; transform: translateY(48px); transition: opacity 700ms ease, transform 900ms cubic-bezier(.22,1,.36,1); }
      .project-gallery figure.is-visible { opacity: 1; transform: translateY(0); }
      .project-gallery figure.is-no-reveal { transition: none; }
      .project-gallery figure.project-figure-no-reveal {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .project-long-image-scroll {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin-left: calc(50% - 50vw);
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .project-long-image-scroll::-webkit-scrollbar { display: none; }
      .project-long-image-scroll figure {
        position: relative;
        width: calc(100vh * 5.998);
        height: 100vh;
        min-width: calc(100vh * 5.998);
      }
      .project-long-image-scroll img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vh;
        height: calc(100vh * 5.998);
        max-width: none;
        transform: rotate(-90deg) translateX(-100%);
        transform-origin: top left;
      }
      .project-gallery figure.is-replaying { animation: project-figure-rise 900ms cubic-bezier(.22,1,.36,1); }
      @keyframes project-figure-rise { from { transform: translateY(48px); } to { transform: translateY(0); } }
      .project-note { margin: 80px 0 0; font-size: 12px; font-weight: 700; color: var(--page-muted); }
      @media (prefers-reduced-motion: reduce) { .project-logo-shell, .project-description { animation: none; } .project-gallery figure, .project-gallery figure.is-visible { opacity: 1; transform: none; transition: none; } }
      @media (max-width: 980px) { .project-row.two-up { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="project-page">
      <span class="project-logo-shell" aria-hidden="true">
        <svg class="project-logo-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" focusable="false">
          <g transform="translate(209.455 235.205)">
            <polyline fill="none" stroke="#000" stroke-width="4.25" stroke-miterlimit="10" vector-effect="non-scaling-stroke" points="658.92 296.12 658.92 607.46 2.13 607.46 2.13 330.85 28.71 330.68 28.56 2.13 633.9 2.13 633.9 296.12" />
            <line fill="none" stroke="#000" stroke-width="4.25" stroke-miterlimit="10" vector-effect="non-scaling-stroke" x1="633.9" y1="2.13" x2="633.9" y2="296.12" />
            <path fill="none" stroke="#000" stroke-width="4.25" stroke-miterlimit="10" vector-effect="non-scaling-stroke" d="M657.36,296.11c0,201.39-155.78,303.96-326.1,303.57-162.86-.37-294.88-132.02-294.88-294.88S168.4,9.91,331.26,9.91s290.16,127.36,294.76,286.2" />
          </g>
        </svg>
        <img class="project-logo-solid" src="logo/blacklogo.svg" alt="" />
      </span>
      <section class="project-description" aria-label="作品简介">
        <h1 class="project-description-title">嘔吐</h1>
        <p class="project-description-year">2025.10</p>
        <div class="project-description-copy">
          <p>萨特的小说《恶心》，在日语中被译作《嘔吐》。</p>
        </div>
      </section>
      <section class="project-gallery" aria-label="作品图像">
        <figure class="project-hero"><img src="image/嘔吐/未标题-9-01.jpg" alt="嘔吐项目主视觉图像" /></figure>
        <div class="project-row two-up"><figure><img src="image/嘔吐/未标题-9-04.jpg" alt="嘔吐项目图像 04" /></figure></div>
        <div class="project-row two-up">
          <figure><img src="image/嘔吐/未标题-9-02.jpg" alt="嘔吐项目图像 02" /></figure>
          <figure><img src="image/嘔吐/未标题-9-05.jpg" alt="嘔吐项目图像 05" /></figure>
        </div>
        <div class="project-row two-up">
          <figure><img src="image/嘔吐/未标题-9-03.jpg" alt="嘔吐项目图像 03" /></figure>
        </div>
        <div class="project-long-image-scroll" aria-label="嘔吐项目长图，可横向滚动查看">
          <figure class="project-figure-no-reveal"><img src="image/嘔吐/未标题-9-06.jpg" alt="嘔吐项目图像 06" /></figure>
        </div>
      </section>
      <p class="project-note">© 2026 MADO DESIGN. ALL RIGHTS RESERVED.</p>
    </main>
    <script>
      const logoShell = document.querySelector('.project-logo-shell');
      if (logoShell) {
        let dragging = false, dragOffsetX = 0, dragOffsetY = 0;
        logoShell.addEventListener('pointerdown', (event) => {
          const rect = logoShell.getBoundingClientRect();
          dragging = true; dragOffsetX = event.clientX - rect.left; dragOffsetY = event.clientY - rect.top;
          logoShell.classList.add('is-active'); logoShell.setPointerCapture(event.pointerId); event.preventDefault();
        });
        logoShell.addEventListener('pointermove', (event) => {
          if (!dragging) return;
          logoShell.style.left = `${Math.min(Math.max(event.clientX - dragOffsetX, 0), window.innerWidth - logoShell.offsetWidth)}px`;
          logoShell.style.top = `${Math.min(Math.max(event.clientY - dragOffsetY, 0), window.innerHeight - logoShell.offsetHeight)}px`;
          logoShell.style.right = 'auto'; logoShell.style.transform = 'translate(0, 0)';
        });
        const stopDragging = (event) => {
          if (!dragging) return;
          dragging = false; logoShell.classList.remove('is-active');
          if (event?.pointerId !== undefined && logoShell.hasPointerCapture(event.pointerId)) logoShell.releasePointerCapture(event.pointerId);
        };
        logoShell.addEventListener('pointerup', stopDragging); logoShell.addEventListener('pointercancel', stopDragging);
      }
      const figures = document.querySelectorAll('.project-gallery figure');
      if (figures.length) {
        let unlocked = false, lastScrollY = window.scrollY;
        const pending = new Set();
        const reveal = (entries) => entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          if (!unlocked) { pending.add(entry); return; }
          const fromBottom = entry.rootBounds && entry.boundingClientRect.top >= entry.rootBounds.bottom;
          const wasVisible = entry.target.classList.contains('is-visible');
          entry.target.classList.add('is-visible');
          if (fromBottom && wasVisible) { entry.target.classList.remove('is-replaying'); void entry.target.offsetWidth; entry.target.classList.add('is-replaying'); }
          if (!fromBottom) { entry.target.classList.add('is-no-reveal'); requestAnimationFrame(() => entry.target.classList.remove('is-no-reveal')); }
        });
        window.addEventListener('scroll', () => {
          const current = window.scrollY, down = current > lastScrollY; lastScrollY = current;
          if (!down || unlocked) return;
          unlocked = true; pending.forEach((entry) => entry.isIntersecting && reveal([entry])); pending.clear();
        }, { passive: true });
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) figures.forEach((figure) => figure.classList.add('is-visible'));
        else {
          const observer = new IntersectionObserver(reveal, { rootMargin: '0px 0px -20% 0px', threshold: 0.05 });
          figures.forEach((figure) => {
            if (!figure.classList.contains('project-figure-no-reveal')) observer.observe(figure);
          });
        }
      }
      const longImageScroller = document.querySelector('.project-long-image-scroll');
      if (longImageScroller && !window.matchMedia('(max-width: 700px)').matches) {
        let snappingToLongImage = false;
        longImageScroller.addEventListener('wheel', (event) => {
          const rect = longImageScroller.getBoundingClientRect();
          const viewportCenter = window.innerHeight / 2;
          const isCentered = Math.abs(rect.top) <= 36 && rect.bottom >= viewportCenter;
          if (!isCentered || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

          const atStart = longImageScroller.scrollLeft <= 0;
          const atEnd = longImageScroller.scrollLeft + longImageScroller.clientWidth >= longImageScroller.scrollWidth - 1;
          const scrollingDown = event.deltaY > 0;
          if ((scrollingDown && atEnd) || (!scrollingDown && atStart)) return;

          event.preventDefault();
          longImageScroller.scrollLeft += event.deltaY;
        }, { passive: false });

        window.addEventListener('wheel', (event) => {
          if (snappingToLongImage || event.deltaY <= 0 || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
          const rect = longImageScroller.getBoundingClientRect();
          const isApproaching = rect.top > 36 && rect.top < window.innerHeight * .9;
          if (!isApproaching) return;

          event.preventDefault();
          snappingToLongImage = true;
          window.scrollTo({ top: window.scrollY + rect.top, behavior: 'smooth' });
          window.setTimeout(() => { snappingToLongImage = false; }, 650);
        }, { passive: false });
      }
      (() => {
        const match = window.location.pathname.match(/project-(\d+)\.html/);
        if (!match || !logoShell) return;
        const current = Number(match[1]);
        let moved = false;
        logoShell.addEventListener('pointerdown', () => { moved = false; });
        logoShell.addEventListener('pointermove', () => { moved = true; });
        logoShell.addEventListener('pointerup', (event) => {
          if (moved) { moved = false; return; }
          const rect = logoShell.getBoundingClientRect();
          const isRightHalf = event.clientX >= rect.left + rect.width / 2;
          const target = isRightHalf ? current + 1 : current - 1;
          if (target < 1 || target > 13) return;
          window.location.href = 'project-' + String(target).padStart(2, '0') + '.html';
        });
      })();
    </script>
  </body>
</html>
