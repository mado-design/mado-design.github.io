<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛮力</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px;
        background: #ffffff;
        color: #000000;
        font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      main {
        max-width: 1180px;
      }

      p {
        margin: 0;
        font-size: clamp(42px, 8vw, 120px);
        line-height: 1.16;
        letter-spacing: 0;
      }

      a {
        display: inline-block;
        margin-top: 40px;
        color: #000000;
        font-size: 20px;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>我承认有的时候蛮力的确能解决问题，但不是全部。</p>
      <a href="index.html">返回</a>
    </main>
  </body>
</html>
